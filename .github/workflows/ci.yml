name: CI

# Aktionen von Dritten sind auf einen Commit-SHA festgelegt, der Tag steht als Kommentar dahinter (Dependabot schlägt Änderungen vor).

on:
  push:
    branches: [main]
  # Der Export (export-solution.yml) öffnet Pull Requests mit dem Token von Actions; deren Workflow-Läufe verlangen eine Freigabe
  # und enden sonst als roter Lauf ("required approval but was not approved"). Reine Änderungen an solution/ brauchen kein CI.
  pull_request:
    paths-ignore:
      - "solution/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest tests/unit -q

  # Integrationstests (Marker dataverse) laufen gegen Nordstern Dev und nur von Hand: Actions, CI, Run workflow.
  # Die Geheimnisse stehen nur in der Umgebung des Testschritts: Checkout, setup-uv und uv sync (das Projekt wird mit hatchling gebaut,
  # das uv.lock nicht festhält) laufen ohne sie. Die Integrationstests lesen nur DATAVERSE_URL_DEV.
  integration:
    if: github.event_name == 'workflow_dispatch'
    needs: lint-and-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: nordstern-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - name: Integrationstests gegen Dev
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          DATAVERSE_URL_DEV: ${{ secrets.DATAVERSE_URL_DEV }}
        run: uv run pytest tests/integration -m dataverse -q
