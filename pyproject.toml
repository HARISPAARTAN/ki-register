[project]
name = "kiregister"
version = "0.1.0"
description = "Nordstern KI-Register: Dataverse-Provisionierung als Code"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["msal>=1.33", "httpx>=0.28", "typer>=0.15"]

[project.scripts]
kiregister = "kiregister.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.22", "ruff>=0.11"]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = ["dataverse: needs a Dataverse environment (DATAVERSE_URL_DEV)"]
addopts = "-m 'not dataverse'"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/kiregister"]
