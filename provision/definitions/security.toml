business_units = ["Nordstern Projektmanagement", "Nordstern Energie", "Nordstern Klinikum"]

[[role]]
name = "nst KI-Governance"
# Spec 5: read on User, Team and Business Unit at organisation level.
privileges = ["prvReadUser", "prvReadTeam", "prvReadBusinessUnit"]
[role.tables]
"*" = { create = "Global", read = "Global", write = "Global", delete = "Global", append = "Global", appendto = "Global", assign = "Global", share = "Global" }

[[role]]
name = "nst Fachbereich"
# appendto on Organisation, KI-System and Mitarbeiter is needed to create an Anwendungsfall with its lookups.
# Organisation (read, appendto): not listed in spec 5, but the lookup "Organisation" of an Anwendungsfall (company picker of the
# canvas app) cannot be filled without read. Local suffices: records are owned by the member-less owner team of the unit (ADR-002), so
# a user with a unit-level role sees the company of their own unit and no other.
[role.tables]
nst_kisystem = { read = "Local", appendto = "Local" }
nst_massnahme = { read = "Local" }
nst_schulung = { read = "Local" }
nst_schulungsteilnahme = { read = "Local" }
nst_mitarbeiter = { read = "Local", appendto = "Local" }
nst_organisation = { read = "Local", appendto = "Local" }
nst_anwendungsfall = { create = "Basic", read = "Basic", write = "Basic", append = "Basic" }

[[role]]
name = "nst Leser"
[role.tables]
nst_kisystem = { read = "Local" }
nst_massnahme = { read = "Local" }
nst_schulung = { read = "Local" }
nst_schulungsteilnahme = { read = "Local" }
nst_mitarbeiter = { read = "Local" }
nst_organisation = { read = "Local" }
nst_anwendungsfall = { read = "Local" }

[[role]]
name = "nst Datenbesitz"
# Role of the owner teams only (src/kiregister/security.py: ensure_owner_teams), never assigned to a user. A team that owns records needs
# read on the table, otherwise the assignment fails with 0x80040299. The teams have no members, so nobody inherits this read access.
[role.tables]
"*" = { read = "Basic" }

[column_security]
profile = "nst KI-Governance Felder"
columns = [{ table = "nst_kisystem", column = "nst_internebewertung" }]
# Documentation only: the code does not bind the profile to roles; the governance users are added to the profile in the portal.
roles_with_access = ["nst KI-Governance"]
