[[table]]
schema = "nst_organisation"
display = "Organisation"
plural = "Organisationen"
primary = { schema = "nst_name", display = "Name", length = 200 }
audit = false

  [[table.column]]
  schema = "nst_kurzname"
  display = "Kurzname"
  type = "string"
  length = 50

  [[table.column]]
  schema = "nst_branche"
  display = "Branche"
  type = "string"
  length = 100

  [[table.column]]
  schema = "nst_businessunitname"
  display = "Business-Unit-Name"
  type = "string"
  length = 100

  [[table.column]]
  schema = "nst_sitz"
  display = "Sitz"
  type = "string"
  length = 100

[[table]]
schema = "nst_mitarbeiter"
display = "Mitarbeiter"
plural = "Mitarbeiter"
