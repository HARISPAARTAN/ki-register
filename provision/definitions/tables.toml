  [[table.column]]
  schema = "nst_kiverantwortlich"
  display = "KI-verantwortlich"
  type = "bool"

[[table]]
schema = "nst_kisystem"
display = "KI-System"
plural = "KI-Systeme"
primary = { schema = "nst_name", display = "Name", length = 200 }
audit = true

  [[table.column]]
  schema = "nst_kennung"
  display = "Kennung"
  type = "autonumber"
  format = "KIS-{SEQNUM:4}"

  [[table.column]]
  schema = "nst_fachbereich"
  display = "Fachbereich"
  type = "string"
  length = 100

  [[table.column]]
  schema = "nst_beschreibung"
  display = "Beschreibung"
  type = "memo"
  length = 4000

  [[table.column]]
  schema = "nst_zweck"
  display = "Zweck"
  type = "memo"
  length = 2000

  [[table.column]]
  schema = "nst_anbieter"
  display = "Anbieter / Hersteller"
  type = "string"
  length = 200

  [[table.column]]
  schema = "nst_systemtyp"
  display = "Systemtyp"
  type = "choice"
  choice = "nst_systemtyp"

  [[table.column]]
  schema = "nst_rolle"
  display = "Rolle nach KI-Verordnung"
  type = "choice"
  choice = "nst_rolle_kivo"

  [[table.column]]
  schema = "nst_status"
  display = "Status"
  type = "choice"
  choice = "nst_status_kisystem"
  required = true

  [[table.column]]
  schema = "nst_inbetriebnahme"
  display = "Inbetriebnahme"
  type = "date"

  [[table.column]]
  schema = "nst_letztepruefung"
  display = "Letzte Prüfung"
  type = "date"

  [[table.column]]
  schema = "nst_naechstepruefung"
  display = "Nächste Prüfung"
  type = "date"

  [[table.column]]
  schema = "nst_datenarten"
  display = "Verarbeitete Datenarten"
  type = "multichoice"
  choice = "nst_datenart"

  [[table.column]]
  schema = "nst_risikoklasse"
  display = "Risikoklasse"
  type = "choice"
  choice = "nst_risikoklasse"

  [[table.column]]
  schema = "nst_anhang3kategorie"
  display = "Anhang-III-Kategorie"
  type = "choice"
  choice = "nst_anhang3_kategorie"

  [[table.column]]
  schema = "nst_transparenzpflicht"
  display = "Transparenzpflicht (Art. 50)"
  type = "bool"

  [[table.column]]
  schema = "nst_eudatenbank"
  display = "Registrierung EU-Datenbank (Art. 49)"
  type = "bool"

  [[table.column]]
  schema = "nst_dokumentation"
  display = "Dokumentation (Link)"
  type = "url"

  [[table.column]]
  schema = "nst_internebewertung"
  display = "Interne Bewertung"
  type = "memo"
  length = 4000
  secured = true

  [[table.column]]
  schema = "nst_pruefungueberfaellig"
  display = "Prüfung überfällig"
  type = "formula"
  result = "bool"
  formula = "nst_status = 'Status KI-System'.'In Betrieb' && !IsBlank(nst_naechstepruefung) && nst_naechstepruefung < Today()"

